<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatenta — Research Relationship Visualization</title>
  <meta name="description" content="Visualize collaboration networks among researchers, institutions, keywords and nations from OpenAlex data. Runs entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button id="sidebar-toggle" class="btn btn-icon" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">☰</button>
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🔬</span>
      <div>
        <h1 data-i18n="app.title">Relatenta</h1>
        <p class="subtitle" data-i18n="app.subtitle">Research Relationship Visualization</p>
      </div>
    </div>
    <div class="topbar-right">
      <label class="lang-select">
        <span data-i18n="lang.label" class="visually-hidden">Language</span>
        <select id="lang-select" aria-label="Language">
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
      </label>
      <a class="btn btn-icon" href="https://github.com/Denny-Hwang/Relatenta" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub repository">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Data controls">
      <div id="sidebar-content"></div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <main class="main" id="main">
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab active" role="tab" data-tab="graph" aria-selected="true" data-i18n="tabs.graph">Graph</button>
        <button class="tab" role="tab" data-tab="heatmaps" aria-selected="false" data-i18n="tabs.heatmaps">Heatmaps</button>
        <button class="tab" role="tab" data-tab="report" aria-selected="false" data-i18n="tabs.report">Report</button>
        <button class="tab" role="tab" data-tab="insights" aria-selected="false" data-i18n="tabs.insights">Insights</button>
        <button class="tab" role="tab" data-tab="howto" aria-selected="false" data-i18n="tabs.how_to_use">How to Use</button>
      </nav>
      <section id="tab-graph" class="tab-panel" role="tabpanel"></section>
      <section id="tab-heatmaps" class="tab-panel" role="tabpanel" hidden></section>
      <section id="tab-report" class="tab-panel" role="tabpanel" hidden></section>
      <section id="tab-insights" class="tab-panel" role="tabpanel" hidden></section>
      <section id="tab-howto" class="tab-panel" role="tabpanel" hidden></section>
    </main>
  </div>

  <noscript><div class="alert alert-warning" style="margin:1rem">Relatenta needs JavaScript — everything runs in your browser, nothing is sent to a server except OpenAlex API queries.</div></noscript>

  <script src="vendor/vis-network.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
