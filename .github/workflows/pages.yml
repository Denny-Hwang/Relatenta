name: Deploy to GitHub Pages

# Publishes web/ to the `gh-pages` branch on every push to main that touches
# the site. GitHub serves that branch at https://denny-hwang.github.io/Relatenta/
# (Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder /).
# The branch-based flow only needs the default GITHUB_TOKEN; the Actions-based
# flow (actions/deploy-pages) requires the Pages site to be created first,
# which the token is not allowed to do.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit / parity tests
        run: node --test "web/tests/*.test.mjs"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish web/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: "tests"
          commit_message: "Deploy ${{ github.sha }}"
