name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff — non-blocking)
        continue-on-error: true
        run: ruff check app tests streamlit_app.py

      - name: Compile-time syntax check
        run: |
          python -m compileall -q app tests streamlit_app.py

      - name: Run pytest
        run: python -m pytest -v

  web:
    name: Static site (web/) parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps (fixture generation uses the real app modules)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate parity fixtures from the Python service layer
        run: python web/tests/gen_expected.py

      - name: Fixtures must be up to date in git
        run: git diff --exit-code -- web/tests/fixtures || (echo "::error::web/tests/fixtures is stale — run 'python web/tests/gen_expected.py' and commit" && exit 1)

      - name: Run JS parity tests
        run: node --test "web/tests/*.test.mjs"

      - name: Install Playwright (browser smoke test)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser smoke test (headless Chromium, OpenAlex mocked)
        run: node web/tests/browser-smoke.mjs
